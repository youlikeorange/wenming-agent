# tools/sync.sh 与 tools/restore.sh 的路径清单（相对宿主站点根目录）
# 每行一个路径；# 开头是注释。要新增受版本管理的路径，在这里加一行即可。
#
# ── 子项目本体：sync 同步进仓库、restore 写回站点
#    public/llm-chat 含构建产物 vendor/（2026-10-01 起入库：让下载者不必 npm install +
#    build 就能直接跑起来，见 README「快速开始」；sync/drift/restore 三处都不再排除它）
agent
lib/agent
public/llm-chat

# ── 宿主依赖：sync 一起同步进来留档（放在真实路径上，这样仓库里的
#    服务端测试能直接跑；standalone.js 独立入口也直接 require 它们），
#    但 restore 默认**不**写回站点 —— 它们是宿主公共件，
#    文档站其他子项目（编辑器、剧本编辑器）也在用，见 HOST-DEPS.md。
@sync-only lib/auth.js
@sync-only lib/config.js
@sync-only lib/http.js
@sync-only lib/lock.js
@sync-only lib/security.js
@sync-only lib/state.js
@sync-only lib/upstream-http.js
@sync-only lib/userdata.js
@sync-only lib/zip.js
@sync-only server.js

# ── 永不入库：sync 不拷进来，restore 也绝不动站点上的原件（--delete 都绕开它们）。
#    这两份是内部审计记录，里面有站点当前的安全弱点与默认口令一类结论，只留本机。
@never agent/AUDIT.md
@never agent/AUDIT-2026-09-30-INDUSTRIAL.md
@never agent/BUGFIX-2026-10-02-SELF-AUDIT.md
